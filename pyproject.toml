[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yt-to-mp3-converter"
version = "2.0.0"
description = "A Windows desktop application for maximum-quality YouTube-to-MP3 conversion"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Serge Chaanine" }]
dependencies = [
    "chardet>=5.2.0,<6",
    "mutagen>=1.47.0,<2",
    "yt-dlp>=2025.1.15",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
    "ruff>=0.9,<1",
]
build = [
    "pyinstaller>=6.11,<7",
]

[project.gui-scripts]
yt-to-mp3 = "yt_to_mp3.app:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
